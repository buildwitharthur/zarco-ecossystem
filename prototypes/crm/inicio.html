<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Início — CRM Zarco (protótipo oficial)</title>
<meta name="robots" content="noindex">
<!-- PROTÓTIPO OFICIAL DO CRM (aprovado por Arthur em 12/10/2026) — referência visual para a implementação. Não é código de produção. Dados fictícios. Fonte: Inter. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Escuro suavizado: mesmos tons da marca, com menos contraste máximo e menos linhas */
    --background: #141517;
    --surface: #1B1C1F;
    --raised: #222327;
    --hover: #2A2B30;
    --text: #E2E0DA;          /* um pouco abaixo de #EDEBE6 para reduzir o brilho */
    --text-2: #A3A5AB;
    --text-3: #7C7F86;
    --line: rgba(237,235,230,.07);
    --line-2: rgba(237,235,230,.12);
    --accent: #FF5A1F;
    --danger: #F97066;
    --danger-bg: rgba(249,112,102,.12);

    --font: "Inter", system-ui, sans-serif;
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--text); font: 400 14px/1.55 var(--font); -webkit-font-smoothing: antialiased; min-width: 1100px; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; }

  /* Barra superior */
  .topbar { height: 64px; display: flex; align-items: center; gap: 32px; padding: 0 28px; border-bottom: 1px solid var(--line); }
  .logo { height: 18px; color: var(--text); display: block; }
  .logo svg { height: 100%; width: auto; display: block; }
  .nav { display: flex; gap: 2px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .nav a { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 8px; color: var(--text-2); text-decoration: none; font-weight: 500; transition: color .2s var(--ease), background .2s var(--ease); }
  .nav a:hover { color: var(--text); }
  .nav a[aria-current="page"] { background: var(--raised); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .nav a[aria-current="page"]::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--accent); }
  .topbar__end { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--raised); border: 1px solid var(--line-2); display: grid; place-items: center; font-weight: 600; font-size: 13px; color: var(--text-2); }

  .btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid transparent; background: none; cursor: pointer; font-weight: 500; text-decoration: none; transition: background .2s var(--ease), transform .2s var(--ease); }
  .btn svg { width: 16px; height: 16px; }
  .btn--primary { background: var(--text); color: var(--background); }
  .btn--primary:hover { transform: translateY(-1px); }
  .btn--ghost { color: var(--text-2); }
  .btn--ghost:hover { background: var(--surface); color: var(--text); }
  .btn--soft { background: var(--raised); border-color: var(--line); }
  .btn--soft:hover { background: var(--hover); }

  main { padding: 28px; display: grid; gap: 28px; max-width: 1480px; margin: 0 auto; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; }
  .page-head h1 { font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; margin: 0; }
  .page-head p { margin: 4px 0 0; color: var(--text-2); }

  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 16px; }
  .section-head h2 { font-size: 15px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; }
  .count { font-size: 12px; font-weight: 500; color: var(--text-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }

  /* Cartões de projeto */
  .projects { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .pcard { display: grid; gap: 16px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); color: inherit; text-decoration: none; transition: transform .25s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease); min-width: 0; opacity: 0; animation: up .5s var(--ease) forwards; }
  .pcard:hover { transform: translateY(-2px); background: var(--raised); box-shadow: var(--shadow); }
  .pcard__name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
  .pcard__client { color: var(--text-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard__foot { display: flex; justify-content: space-between; align-items: center; color: var(--text-2); font-size: 13px; }
  .pcard--new { display: grid; place-items: center; background: transparent; border: 1px dashed var(--line-2); color: var(--text-2); }
  .pcard--new:hover { background: var(--surface); box-shadow: none; }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Progresso de fase: 5 segmentos */
  .phase { display: grid; gap: 8px; }
  .phase__label { display: flex; justify-content: space-between; font-size: 13px; }
  .phase__label span:last-child { color: var(--text-3); }
  .phase__bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
  .phase__bar i { height: 4px; border-radius: 2px; background: var(--hover); }
  .phase__bar i.on { background: var(--text-2); }
  .phase__bar i.now { background: var(--text); }

  /* Saúde */
  .health { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--raised); color: var(--text-2); }
  .health::before { content: ""; width: 7px; height: 7px; border-radius: 2px; box-sizing: border-box; }
  .health--blocked { background: var(--danger-bg); color: var(--danger); }
  .health--blocked::before { background: var(--danger); }
  .health--attention { color: var(--text); background: var(--hover); }
  .health--attention::before { border: 1.5px solid var(--text); background: linear-gradient(135deg, var(--text) 50%, transparent 50%); }
  .health--ok::before { border: 1.5px solid var(--text-2); }
  .health--none::before { height: 1.5px; border-radius: 1px; background: var(--text-3); }
  .health--none { color: var(--text-3); }

  /* Filtro */
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .seg button { border: 0; background: none; height: 28px; padding: 0 12px; border-radius: 7px; color: var(--text-2); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .2s var(--ease), color .2s var(--ease); }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.3); }

  /* Quadro */
  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
  .col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 8px; min-height: 440px; display: flex; flex-direction: column; transition: background .2s var(--ease); }
  .col.is-over { background: var(--raised); }
  .col__head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 12px; font-weight: 600; }
  .col__head .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--text-2); }
  .col[data-col="doing"] .dot { background: linear-gradient(90deg, var(--text-2) 50%, transparent 50%); }
  .col[data-col="done"] .dot { background: var(--text-2); }
  .col__head .hint { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--text-3); }
  .col__list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; align-content: start; flex: 1; }

  .quick { display: flex; gap: 6px; margin-bottom: 8px; }
  .quick input { flex: 1; min-width: 0; height: 38px; padding: 0 12px; background: transparent; border: 1px dashed var(--line-2); border-radius: 10px; transition: border-color .2s, background .2s; }
  .quick input:hover { border-color: #5a5c63; }
  .quick input:focus { outline: none; border-style: solid; border-color: var(--text-2); background: var(--raised); }
  .quick input::placeholder { color: var(--text-3); }
  .quick select { height: 38px; max-width: 150px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 10px; padding: 0 8px; font-size: 13px; color: var(--text-2); }

  .task { position: relative; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 10px; cursor: grab; transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; animation: up .35s var(--ease) both; }
  .task:hover { border-color: var(--line-2); box-shadow: var(--shadow); transform: translateY(-1px); }
  .task.is-dragging { opacity: .4; }
  .task__title { padding-right: 22px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .task--done .task__title { color: var(--text-2); }
  .task__meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
  .tag { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); max-width: 160px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .due { display: inline-flex; align-items: center; gap: 5px; }
  .due svg { width: 13px; height: 13px; }
  .due--late { color: var(--danger); font-weight: 500; }
  .task__menu { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border: 0; background: none; color: var(--text-2); border-radius: 7px; cursor: pointer; opacity: 0; transition: opacity .15s; }
  .task:hover .task__menu, .task__menu:focus-visible, .task__menu[aria-expanded="true"] { opacity: 1; }
  .task__menu:hover { background: var(--hover); color: var(--text); }
  .placeholder { height: 46px; border-radius: var(--r-md); border: 1px dashed var(--line-2); background: rgba(237,235,230,.02); }

  .menu { position: absolute; top: 36px; right: 8px; z-index: 10; min-width: 190px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.55); padding: 6px; display: grid; animation: up .18s var(--ease); }
  .menu button { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .menu button:hover, .menu button:focus-visible { background: var(--hover); outline: none; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .menu .danger { color: var(--danger); }

  .toast { position: fixed; right: 24px; bottom: 24px; display: flex; gap: 10px; align-items: center; background: var(--raised); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 16px; box-shadow: 0 16px 40px rgba(0,0,0,.55); opacity: 0; transform: translateY(10px); transition: opacity .25s var(--ease), transform .25s var(--ease); pointer-events: none; }
  .toast.is-on { opacity: 1; transform: none; }
  .toast svg { width: 16px; height: 16px; color: var(--text-2); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .pcard { opacity: 1; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-cal" viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
  <symbol id="i-ok" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="m5.3 8.2 1.8 1.8 3.6-3.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="topbar">
  <a class="logo" href="#" aria-label="Zarco, início"><svg viewBox="0 0 192 41" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M0 0.5H34V8L10.69 32.9H34V40.5H0V32.9L23.31 8H0ZM39.6 40.5L52.9 0.5H60.3L73.6 40.5H65.8L62.98 32H50.22L47.4 40.5ZM52.39 25.5L56.6 12.83L60.81 25.5ZM80.7 0.5H102.2A9.5 9.5 0 0 1 111.7 10V14.5A9.5 9.5 0 0 1 102.2 24H101.7L111.7 40.5H102.58L92.58 24H88.7V40.5H80.7ZM88.7 8H101.7A2.4 2.4 0 0 1 104.1 10.4V14.1A2.4 2.4 0 0 1 101.7 16.5H88.7ZM151.1 0H131.6A12.5 12.5 0 0 0 119.1 12.5V28.5A12.5 12.5 0 0 0 131.6 41H151.1V33.6H131.3A4.2 4.2 0 0 1 127.1 29.4V11.6A4.2 4.2 0 0 1 131.3 7.4H151.1ZM170.5 0H179.5A12.5 12.5 0 0 1 192 12.5V28.5A12.5 12.5 0 0 1 179.5 41H170.5A12.5 12.5 0 0 1 158 28.5V12.5A12.5 12.5 0 0 1 170.5 0ZM170.2 7.4H179.8A4.2 4.2 0 0 1 184 11.6V29.4A4.2 4.2 0 0 1 179.8 33.6H170.2A4.2 4.2 0 0 1 166 29.4V11.6A4.2 4.2 0 0 1 170.2 7.4Z"/></svg></a>
  <nav class="nav" aria-label="Principal">
    <a href="#" aria-current="page">Início</a><a href="#">Projetos</a><a href="#">Clientes</a><a href="#">Modelos</a>
  </nav>
  <div class="topbar__end"><button class="btn btn--ghost" type="button">Sair</button><span class="avatar" aria-hidden="true">A</span></div>
</header>

<main>
  <div class="page-head">
    <div><h1>Bom dia, Arthur</h1><p>Segunda-feira, 12 de outubro</p></div>
    <a class="btn btn--primary" href="#"><svg aria-hidden="true"><use href="#i-plus"/></svg>Novo projeto</a>
  </div>

  <section aria-labelledby="h-proj">
    <div class="section-head"><h2 id="h-proj">Projetos em andamento <span class="count num" id="pcount"></span></h2></div>
    <div class="projects" id="projects"></div>
  </section>

  <section aria-labelledby="h-tasks">
    <div class="section-head"><h2 id="h-tasks">Tarefas</h2><div class="seg" id="filter" role="group" aria-label="Filtrar por projeto"></div></div>
    <div class="board" id="board"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"><svg aria-hidden="true"><use href="#i-ok"/></svg><span></span></div>

<script>
  const TODAY = '2026-10-12';
  const PHASES = ['Diagnóstico', 'Projeto', 'Construção', 'Validação', 'Entrega'];
  const projects = [
    { id: 'p1', name: 'Sistema de pedidos', client: 'Distribuidora Litoral', phase: 'Construção', health: 'blocked', due: '2026-11-06' },
    { id: 'p2', name: 'Portal do cliente', client: 'Clínica Boa Vista', phase: 'Validação', health: 'attention', due: '2026-10-23' },
    { id: 'p3', name: 'Integração de estoque', client: 'Mercado Alvorada', phase: 'Projeto', health: 'ok', due: '2026-12-04' },
    { id: 'p4', name: 'Controle de ordens de serviço', client: 'Refrigeração Icaraí', phase: 'Diagnóstico', health: null, due: null },
  ];
  const HO = { blocked: 0, attention: 1, ok: 2, null: 3 };
  const HL = { blocked: 'Bloqueado', attention: 'Atenção', ok: 'No prazo' };
  const cols = [{ id: 'todo', name: 'A fazer' }, { id: 'doing', name: 'Fazendo' }, { id: 'done', name: 'Feito', hint: 'Últimos 14 dias' }];
  let tasks = [
    { id: 't1', p: 'p1', title: 'Aguardar acesso à API do ERP (cliente)', s: 'todo', due: '2026-10-08' },
    { id: 't2', p: 'p2', title: 'Rodada de validação com a recepção', s: 'todo', due: '2026-10-14' },
    { id: 't3', p: 'p3', title: 'Mapear campos da planilha de estoque', s: 'todo', due: null },
    { id: 't4', p: 'p4', title: 'Visita para acompanhar a abertura de uma OS', s: 'todo', due: '2026-10-15' },
    { id: 't5', p: 'p1', title: 'Tela de conferência de pedidos', s: 'doing', due: '2026-10-17' },
    { id: 't6', p: 'p2', title: 'Ajustar envio de lembrete de consulta', s: 'doing', due: '2026-10-10' },
    { id: 't7', p: 'p3', title: 'Escrever escopo e critérios de aceite', s: 'doing', due: '2026-10-20' },
    { id: 't8', p: 'p1', title: 'Cadastro de produtos com importação de planilha', s: 'done', due: null },
    { id: 't9', p: 'p2', title: 'Login de pacientes', s: 'done', due: null },
  ];
  let filter = 'all';
  const $ = s => document.querySelector(s);
  const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const short = d => { const [y,m,dd] = d.split('-'); return `${+dd} ${MES[+m-1]}`; };
  const full = d => d ? d.split('-').reverse().join('/') : 'Sem previsão';
  const pBy = id => projects.find(p => p.id === id);
  const toast = m => { const t = $('#toast'); t.querySelector('span').textContent = m; t.classList.add('is-on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('is-on'), 3500); };
  const health = h => h ? `<span class="health health--${h}">${HL[h]}</span>` : `<span class="health health--none">Sem avaliação</span>`;


  function renderProjects() {
    const list = [...projects].sort((a, b) => HO[a.health] - HO[b.health] || (a.due || '9').localeCompare(b.due || '9'));
    $('#pcount').textContent = projects.length;
    $('#projects').innerHTML = list.map((p, i) => {
      const k = PHASES.indexOf(p.phase);
      return `<a class="pcard" href="#" style="animation-delay:${i * 60}ms" title="${p.name} · ${p.client}">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
          <div style="min-width:0"><div class="pcard__name">${p.name}</div><div class="pcard__client">${p.client}</div></div>
        </div>
        <div class="phase"><div class="phase__label"><span>${p.phase}</span><span class="num">${k + 1}/5</span></div>
          <div class="phase__bar" aria-hidden="true">${PHASES.map((_, j) => `<i class="${j < k ? 'on' : j === k ? 'now' : ''}"></i>`).join('')}</div></div>
        <div class="pcard__foot">${health(p.health)}<span class="num">${p.due ? 'Entrega ' + short(p.due) : 'Sem previsão'}</span></div>
      </a>`;
    }).join('') + (projects.length < 5 ? `<a class="pcard pcard--new" href="#" style="animation-delay:${projects.length * 60}ms"><span class="btn btn--ghost"><svg aria-hidden="true"><use href="#i-plus"/></svg>Novo projeto</span></a>` : '');
  }
  function renderFilter() {
    $('#filter').innerHTML = [{ id: 'all', name: 'Todos' }, ...projects].map(o => `<button type="button" aria-pressed="${filter === o.id}" data-f="${o.id}">${o.name}</button>`).join('');
    $('#filter').querySelectorAll('button').forEach(b => b.onclick = () => { filter = b.dataset.f; renderFilter(); renderBoard(); });
  }
  function taskHTML(t, i) {
    const late = t.due && t.due < TODAY && t.s !== 'done';
    const tag = filter === 'all' ? `<span class="tag">${pBy(t.p).name}</span>` : '';
    const due = t.due ? `<span class="due ${late ? 'due--late' : ''}"><svg aria-hidden="true"><use href="#i-cal"/></svg><span class="num">${late ? 'Atrasada · ' : ''}${short(t.due)}</span></span>` : '';
    return `<li class="task ${t.s === 'done' ? 'task--done' : ''}" draggable="true" data-id="${t.id}" style="animation-delay:${i * 30}ms">
      <div class="task__title">${t.title}</div>${(tag || due) ? `<div class="task__meta">${tag}${due}</div>` : ''}
      <button class="task__menu" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Ações da tarefa">⋯</button></li>`;
  }
  function renderBoard() {
    const vis = tasks.filter(t => filter === 'all' || t.p === filter);
    $('#board').innerHTML = cols.map(c => {
      const list = vis.filter(t => t.s === c.id);
      const quick = c.id === 'todo' ? `<form class="quick" id="quick"><label class="sr-only" for="qt">Nova tarefa</label><input id="qt" placeholder="+  Nova tarefa" autocomplete="off">${filter === 'all' ? `<label class="sr-only" for="qp">Projeto</label><select id="qp">${projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select>` : ''}</form>` : '';
      return `<div class="col" data-col="${c.id}"><div class="col__head"><span class="dot" aria-hidden="true"></span>${c.name}<span class="count num">${list.length}</span>${c.hint ? `<span class="hint">${c.hint}</span>` : ''}</div>${quick}<ul class="col__list" data-col="${c.id}">${list.map(taskHTML).join('')}</ul></div>`;
    }).join('');
    bind();
  }
  function move(id, to, before) { const i = tasks.findIndex(t => t.id === id); const [t] = tasks.splice(i, 1); t.s = to; const j = before ? tasks.findIndex(x => x.id === before) : -1; j >= 0 ? tasks.splice(j, 0, t) : tasks.push(t); renderBoard(); }
  function bind() {
    $('#quick').onsubmit = e => { e.preventDefault(); const v = $('#qt').value.trim(); if (!v) return; tasks.push({ id: 't' + Date.now(), p: filter === 'all' ? $('#qp').value : filter, title: v, s: 'todo', due: null }); renderBoard(); $('#qt').focus(); toast('Tarefa criada'); };
    let drag = null; const ph = document.createElement('li'); ph.className = 'placeholder';
    document.querySelectorAll('.task').forEach(el => { el.ondragstart = e => { drag = el.dataset.id; el.classList.add('is-dragging'); e.dataTransfer.effectAllowed = 'move'; }; el.ondragend = () => { el.classList.remove('is-dragging'); ph.remove(); document.querySelectorAll('.col').forEach(c => c.classList.remove('is-over')); }; });
    document.querySelectorAll('.col__list').forEach(list => {
      const col = list.closest('.col');
      col.ondragover = e => { e.preventDefault(); col.classList.add('is-over'); const after = [...list.querySelectorAll('.task:not(.is-dragging)')].find(t => e.clientY < t.getBoundingClientRect().top + t.offsetHeight / 2); after ? list.insertBefore(ph, after) : list.appendChild(ph); };
      col.ondragleave = e => { if (!col.contains(e.relatedTarget)) { col.classList.remove('is-over'); ph.remove(); } };
      col.ondrop = e => { e.preventDefault(); const nx = ph.nextElementSibling; ph.remove(); if (drag) move(drag, list.dataset.col, nx && nx.dataset.id); };
    });
    document.querySelectorAll('.task__menu').forEach(btn => btn.onclick = e => {
      e.stopPropagation(); close(); const li = btn.closest('.task'); const t = tasks.find(x => x.id === li.dataset.id); btn.setAttribute('aria-expanded', 'true');
      const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
      m.innerHTML = cols.filter(c => c.id !== t.s).map(c => `<button role="menuitem" data-to="${c.id}">Mover para ${c.name}</button>`).join('') + `<button role="menuitem" data-up>Subir</button><button role="menuitem" data-down>Descer</button><hr><button role="menuitem" class="danger" data-del>Excluir tarefa</button>`;
      li.appendChild(m); m.querySelector('button').focus();
      m.onclick = ev => { const b = ev.target.closest('button'); if (!b) return;
        if (b.dataset.to) { move(t.id, b.dataset.to); toast(`Movida para ${cols.find(c => c.id === b.dataset.to).name}`); }
        else if ('up' in b.dataset || 'down' in b.dataset) { const same = tasks.filter(x => x.s === t.s && (filter === 'all' || x.p === filter)); const k = same.indexOf(t); const o = same[k + ('up' in b.dataset ? -1 : 1)]; if (o) { const a = tasks.indexOf(t), z = tasks.indexOf(o); [tasks[a], tasks[z]] = [tasks[z], tasks[a]]; } renderBoard(); }
        else if ('del' in b.dataset && confirm(`Excluir a tarefa "${t.title}"?`)) { tasks = tasks.filter(x => x !== t); renderBoard(); toast('Tarefa excluída'); } };
      m.onkeydown = ev => { if (ev.key === 'Escape') { close(); btn.focus(); } };
    });
  }
  function close() { document.querySelectorAll('.menu').forEach(m => m.remove()); document.querySelectorAll('.task__menu').forEach(b => b.setAttribute('aria-expanded', 'false')); }
  document.addEventListener('click', close);
  renderProjects(); renderFilter(); renderBoard();
</script>
</body>
</html>
