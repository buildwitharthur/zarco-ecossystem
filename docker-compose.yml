# Bancos locais. As aplicações rodam com `pnpm dev`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zarco
      POSTGRES_PASSWORD: zarco
      POSTGRES_DB: zarco
    ports:
      - '5436:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zarco -d zarco']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zarco
      POSTGRES_PASSWORD: zarco
      POSTGRES_DB: zarco_test
    ports:
      - '5435:5432'
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zarco -d zarco_test']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  postgres-test-data:
