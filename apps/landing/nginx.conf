server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Endereço canônico (RNF-LP-08). O TLS termina no proxy do Coolify, que informa o
    # protocolo original em X-Forwarded-Proto; localmente o cabeçalho não existe e nada redireciona.
    set $canonical "https://zarcosoftware.com.br";
    if ($host ~* ^www\.) {
        return 301 $canonical$request_uri;
    }
    if ($http_x_forwarded_proto = "http") {
        return 301 $canonical$request_uri;
    }

    # Compressão (o HTML já é comprimido por padrão; woff2 e imagens não precisam)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml image/x-icon;

    # Os cabeçalhos de segurança se repetem em cada location: add_header num location
    # substitui os do servidor.

    # TELA-LP-02: status 404 com a página própria
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Arquivos com hash do Astro: cache longo
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # Favicons, imagem de compartilhamento e marca: sem hash, cache moderado
    location ~* \.(?:ico|png|svg)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # HTML, robots.txt e sitemap: sempre revalidados
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/index.html =404;
    }
}
